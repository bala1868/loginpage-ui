<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
      <link rel="Stylesheet" href="index.css">
</head>
       
<body>
      <div class="login-page-container">
            
            <div class="login-form-container">
                  <div class="logo">
                    <img src="brand-logo.jpg" alt="brand-logo">
                </div>
            <h1>Login</h1>
            <form class="login-form">
                <label for="email">
                     Email
                  </label>
                  <input type="email" id="email"
                           placeholder="Enter Your Email">

                <label for="password">
                     password
                </label>
                  <input type="password" id="password" placeholder="Enter Your Password">
                
            </form>
            <div class="options">
                 <label for="remind-me"> <input type="checkbox" id="remind-me">
                Remind me</label>
                <a href="#" class="forget">forget password?</a>
             </div>
               <button type="submit" class="login-btn">Login</button>
        <div class="others">
              <p>Or Continue with</p>
              <div class="social-logo">
                <div class="social-icon">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFXKAK7cZ26XOiBoEGEzpLler6uCca51MFIUVDn5CwDA&s" alt="google-img">
                </div>
                 <div class="social-icon">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmrNQEr1BtPseqNiD50__K2MIGPmqUF0jAwKXJ_NTDiw&s" alt="google-img">
                </div> <div class="social-icon">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1SBC_sjPTvnzNgO8gsHTxsWvss9tSOlmEo0-khVFPLg&s=10" alt="google-img">
                </div>
              </div>
              <p>
                Don't have account with us? <a href="#">Register</a>
              </p>
              
        </div>
            </div>
      </div>
</body>
</html>
